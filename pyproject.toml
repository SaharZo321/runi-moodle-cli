[project]
name = "moodle-cli"
version = "1.1.0"
description = "Lightweight cross-platform CLI for Moodle (Reichman University and other Moodle sites)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "zendriver>=0.18.0",
]

[project.optional-dependencies]
# Kept empty for backward compatibility; browser SSO (zendriver) is now built in.
browser = []

[project.urls]
Homepage = "https://github.com/SaharZo321/moodle-cli"
Repository = "https://github.com/SaharZo321/moodle-cli"
Issues = "https://github.com/SaharZo321/moodle-cli/issues"

[project.scripts]
mdl = "moodle_cli.cli:main"
moodle-cli = "moodle_cli.cli:main"
runi = "moodle_cli.cli:main"
runi-moodle-cli = "moodle_cli.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
