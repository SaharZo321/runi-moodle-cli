[project]
name = "runi-moodle-cli"
version = "1.0.0"
description = "Lightweight cross-platform CLI for Reichman University (RUNI) Moodle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]

[project.urls]
Homepage = "https://github.com/SaharZo321/runi-moodle-cli"
Repository = "https://github.com/SaharZo321/runi-moodle-cli"
Issues = "https://github.com/SaharZo321/runi-moodle-cli/issues"

[project.scripts]
runi-moodle-cli = "runi_moodle_cli.cli:main"
runi = "runi_moodle_cli.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runi_moodle_cli"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
