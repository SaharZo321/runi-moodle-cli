name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["TAG_NAME"]
          if actual != expected:
              sys.exit(f"Tag {actual!r} does not match pyproject.toml version ({expected!r})")
          print(f"Verified tag {actual} matches pyproject.toml")
          '

      - name: Run tests
        run: |
          uv sync --locked
          uv run pytest -v

      - name: Build distributions
        run: uv build

      - name: Smoke test wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv venv /tmp/release-smoke
          uv pip install --python /tmp/release-smoke/bin/python "$WHEEL"
          /tmp/release-smoke/bin/mdl --version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
