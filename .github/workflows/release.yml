name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-build-python:
    name: Verify tag, test & build Python dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["TAG_NAME"]
          if actual != expected:
              sys.exit(f"Tag {actual!r} does not match pyproject.toml version ({expected!r})")
          print(f"Verified tag {actual} matches pyproject.toml")
          '

      - name: Run tests
        run: |
          uv sync --locked
          uv run pytest -v

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv venv /tmp/release-smoke
          uv pip install --python /tmp/release-smoke/bin/python "$WHEEL"
          /tmp/release-smoke/bin/mdl --version

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  build-binaries:
    name: Build binary (${{ matrix.os }})
    needs: verify-and-build-python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary_name: mdl-linux-x64
            file_name: mdl-linux-x64
          - os: macos-latest
            binary_name: mdl-macos-arm64
            file_name: mdl-macos-arm64
          - os: windows-latest
            binary_name: mdl-windows-x64
            file_name: mdl-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install runtime dependencies and PyInstaller
        shell: bash
        run: |
          uv sync --locked --no-dev
          uv pip install "pyinstaller>=6.10,<7"

      - name: Build standalone binary
        shell: bash
        run: |
          uv run --no-sync pyinstaller \
            --onefile \
            --paths src \
            --name "${{ matrix.binary_name }}" \
            --copy-metadata moodle-cli \
            --collect-submodules rich._unicode_data \
            --collect-submodules zendriver \
            --collect-data docx \
            --collect-data pptx \
            --collect-data certifi \
            --collect-data emoji \
            packaging/pyinstaller_entry.py

      - name: Smoke test standalone binary
        shell: bash
        env:
          NO_COLOR: "1"
          TAG_NAME: ${{ github.ref_name }}
          FILE_NAME: ${{ matrix.file_name }}
        run: |
          OUT=$("./dist/${FILE_NAME}" --version | tr -d '\r')
          EXPECTED="moodle-cli ${TAG_NAME#v}"
          echo "Binary reported: $OUT"
          if [ "$OUT" != "$EXPECTED" ]; then
            echo "Expected '$EXPECTED', got '$OUT'"
            exit 1
          fi
          "./dist/${FILE_NAME}" --help > /dev/null

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary_name }}
          path: dist/${{ matrix.file_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-and-build-python, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          (cd release-assets && LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes
