name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build
      - name: Smoke test installed entrypoints
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python "$WHEEL"
          for cmd in mdl moodle-cli runi runi-moodle-cli; do
            /tmp/smoke-venv/bin/"$cmd" --version
          done

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed: test=${{ needs.test.result }}, build=${{ needs.build.result }}"
            exit 1
          fi
